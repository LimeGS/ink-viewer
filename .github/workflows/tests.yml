name: Coverage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -e '.[test]'
      - run: npm ci
      - name: Python coverage (at least 90%)
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests/python -p 'test_*.py'
          python -m coverage combine
          python -m coverage report
          python -m coverage json -o coverage/python/coverage.json
          python -m coverage xml -o coverage/python/coverage.xml
      - name: JavaScript coverage (at least 90%)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: ignore
  python-versions:
    # Coverage runs on 3.11 above; this checks the oldest and newest supported Pythons.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests/python -p 'test_*.py'
