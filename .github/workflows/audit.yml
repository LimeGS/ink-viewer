name: Dependency audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit Python runtime dependencies
        run: python -m pip_audit . --strict
      - run: npm ci
      - name: Audit JavaScript development dependencies
        run: npm audit --audit-level=low
