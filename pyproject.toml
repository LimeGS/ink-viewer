[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ink-viewer"
version = "0.1.0"
description = "Viewer and annotator for Vesuvius ink maps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-Inter.txt"]
dependencies = ["boto3", "Pillow"]

[project.scripts]
ink-viewer = "ink_viewer.server.s3cache_proxy:main"
ink-viewer-deploy = "ink_viewer.deployment.viewerctl:main"
ink-viewer-publish = "ink_viewer.deployment.publish_preview:main"
ink-viewer-manifest = "ink_viewer.catalog.generar_manifest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ink_viewer = ["web/*.html", "web/pages/*.html", "web/js/*.js", "web/css/*.css", "web/fonts/*.woff2", "web/images/*.webp"]

[project.optional-dependencies]
test = ["coverage[toml]>=7.10,<8", "ruff==0.16.9", "pip-audit>=2.9,<3", "numpy>=1.26", "tifffile>=2024.1", "numcodecs>=0.12", "imagecodecs>=2024.1"]
inksdk = ["numpy>=1.26"]
corte = ["numpy>=1.26", "tifffile>=2024.1", "numcodecs>=0.12"]
hf = ["huggingface_hub>=0.24"]
crop = ["numpy>=1.26", "tifffile>=2024.1", "imagecodecs>=2024.1"]

[tool.coverage.run]
source = ["ink_viewer"]
patch = ["subprocess"]
relative_files = true
parallel = true
sigterm = true

[tool.coverage.paths]
source = ["src/ink_viewer", "*/src/ink_viewer", "*/site-packages/ink_viewer"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests/python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "UP", "B", "I"]
ignore = ["B905"]  # zip() strictness: pairs here are built with equal lengths

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E731"]  # short request helpers inside test methods
